name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"
          pip install pytest-cov

      - name: Lint (ruff)
        run: ruff check . --output-format=github

      - name: Format check
        run: ruff format . --check

      - name: Type check (mypy)
        run: mypy wallet_manager/ --ignore-missing-imports

      - name: Collect tests (dry-run)
        env:
          VAULT_KEY: "kVdPFDoKAHLY4q8X_UrFNVYp5OjLw7fIqO8YtK-3rWo="
          EXECUTION_MODE: "ml_quant"
          TELEGRAM_BOT_TOKEN: "test_token"
          TELEGRAM_CHAT_ID: "123456789"
        run: pytest --co -q

      - name: Test with coverage
        env:
          VAULT_KEY: "kVdPFDoKAHLY4q8X_UrFNVYp5OjLw7fIqO8YtK-3rWo="
          EXECUTION_MODE: "ml_quant"
          TELEGRAM_BOT_TOKEN: "test_token"
          TELEGRAM_CHAT_ID: "123456789"
        run: |
          pytest tests/ -v -n auto \
            --cov=wallet_manager \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=85

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          fail_ci_if_error: false

      - name: Build Docker image
        run: docker build -t wallet-manager:${{ github.sha }} .

      - name: Smoke test Docker image
        run: |
          docker run --rm \
            -e VAULT_KEY=kVdPFDoKAHLY4q8X_UrFNVYp5OjLw7fIqO8YtK-3rWo= \
            -e EXECUTION_MODE=legacy \
            wallet-manager:${{ github.sha }} \
            python -c "from wallet_manager.config import get_settings; print('OK')"

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install bandit
        run: pip install bandit

      - name: Security scan (bandit)
        run: bandit -r wallet_manager/ -ll

  publish:
    name: Publish Docker image
    needs: [quality, security]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
